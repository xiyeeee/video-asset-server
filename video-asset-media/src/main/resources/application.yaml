server:
  port: ${MEDIA_PORT:18082}
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: video-asset-media
  datasource:
    url: ${MYSQL_MEDIA_JDBC_URL:${MYSQL_JDBC_URL:}}
    username: ${MYSQL_MEDIA_USERNAME:video_asset_media}
    password: ${MYSQL_MEDIA_PASSWORD}
    hikari:
      connection-timeout: 3000
      maximum-pool-size: 8
  servlet:
    multipart:
      max-file-size: ${VIDEO_UPLOAD_MAX_FILE_SIZE:100MB}
      max-request-size: ${VIDEO_UPLOAD_MAX_REQUEST_SIZE:101MB}
      file-size-threshold: 0B
      resolve-lazily: true
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR}
        username: ${NACOS_USERNAME}
        password: ${NACOS_PASSWORD}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_DISCOVERY_GROUP:VIDEO_ASSET}
        ip: ${SERVICE_ADVERTISE_IP:}
      config:
        server-addr: ${NACOS_SERVER_ADDR}
        username: ${NACOS_USERNAME}
        password: ${NACOS_PASSWORD}
        namespace: ${NACOS_NAMESPACE:}

app:
  jwt:
    issuer: ${JWT_ISSUER}
    audience: ${JWT_AUDIENCE}
    public-key-location: ${JWT_PUBLIC_KEY_LOCATION}
  minio:
    endpoint: ${MINIO_ENDPOINT}
    playback-endpoint: ${MINIO_PLAYBACK_ENDPOINT:${app.minio.endpoint}}
    region: ${MINIO_REGION:us-east-1}
    access-key: ${MINIO_ACCESS_KEY}
    secret-key: ${MINIO_SECRET_KEY}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

---

spring:
  config:
    activate:
      on-profile: "!dev | prod"
    import: "nacos:video-asset-media.yaml?group=${NACOS_CONFIG_GROUP:VIDEO_ASSET}&refreshEnabled=false"
